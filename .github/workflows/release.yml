name: Release

# Tag-driven release pipeline. Triggers on:
#   - push of a tag matching v* (e.g. v1.0.3)
#   - manual workflow_dispatch (for ad-hoc dry runs)
#
# Cross-platform matrix builds everything that `npm run tauri:build` can
# produce. `tauri-action` is the official Tauri integration: it consumes
# TAURI_SIGNING_PRIVATE_KEY, signs updater artifacts, and creates the
# GitHub release with the right assets and an `update.json` manifest.
#
# Required secrets (set in repo Settings → Secrets and variables):
#   TAURI_SIGNING_PRIVATE_KEY         - minisign private key contents
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD - optional, only if your key has one
#   GITHUB_TOKEN                      - provided automatically by Actions
#
# Optional (only needed for native installer signing, NOT required for
# tauri-plugin-updater's minisign signature):
#   APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_KEYCHAIN_PROFILE
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD, WINDOWS_CERT_THUMBPRINT, WINDOWS_TIMESTAMP_URL

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# prevent duplicate runs while a release is in flight
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# tauri-action needs to create the GitHub Release and upload signed assets
permissions:
  contents: write

jobs:
  release:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/target -> release

      - name: Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build + sign + publish
        # Pinned to a known-good SHA (used successfully for v1.1.20). Only
        # responsible for building, signing and uploading the installer exe.
        # The updater manifest (latest.json) is generated + uploaded by the
        # next step, because tauri-action's built-in uploadVersionJSON depends
        # on fragile internal signature-upload ordering and silently skips.
        uses: tauri-apps/tauri-action@abbd19ad15b37f89667db9cc46ec1cb5419f22be
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # minisign (tauri-plugin-updater). Required.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          # macOS code-signing. Optional. Skip with FLOWIX_ALLOW_UNSIGNED=1.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}

          # Windows code-signing.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}

        with:
          tagName: v__VERSION__
          releaseName: "Flowix v__VERSION__"
          releaseBody: |
            See the [CHANGELOG] for the full set of changes.

            [CHANGELOG]: ../../CHANGELOG.md
          releaseDraft: false
          prerelease: false
          # We generate + upload latest.json ourselves in the next step, so
          # disable tauri-action's (unreliable) built-in updater manifest upload.
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }}

      # ------------------------------------------------------------------
      # Generate the updater manifest (latest.json) and upload it to the
      # release. This is done manually because tauri-action@abbd19a's
      # uploadVersionJSON silently skips when it can't find the .sig among
      # already-uploaded assets. We read the .sig produced by the build and
      # embed it directly, so no separate .sig asset is needed.
      # ------------------------------------------------------------------
      - name: Generate + upload updater manifest (latest.json)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"            # e.g. v1.1.21
          VER="${VERSION#v}"                           # 1.1.21

          # 1) locate the minisign .sig produced by the build (content-identical
          #    to the uploaded exe, just a different filename)
          SIG_FILE=$(find . -name '*.exe.sig' -not -path '*/node_modules/*' 2>/dev/null | head -1)
          if [ -z "${SIG_FILE}" ]; then
            echo "::error::could not find a *.exe.sig artifact from the build"
            exit 1
          fi
          SIGNATURE=$(cat "${SIG_FILE}")

          # 2) pubkey from tauri.conf.json (JSON5-safe, line-based grep)
          PUBKEY=$(grep -o '"pubkey": *"[^"]*"' app/tank-desktop/tauri.conf.json | sed 's/"pubkey": *"//;s/"$//')
          if [ -z "${PUBKEY}" ]; then
            echo "::error::could not extract pubkey from tauri.conf.json"
            exit 1
          fi

          # 3) the actual uploaded asset name (tauri-action may rename it)
          ASSET_NAME=$(gh release view "${VERSION}" --json assets --jq '.assets[].name' | grep -E '_x64-setup\.exe$' | head -1)
          if [ -z "${ASSET_NAME}" ]; then
            echo "::error::could not find the uploaded *_x64-setup.exe asset for ${VERSION}"
            exit 1
          fi

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          ENCODED=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "${ASSET_NAME}")
          URL="https://github.com/guail/tank/releases/download/${VERSION}/${ENCODED}"

          cat > latest.json <<EOF
          {
            "version": "${VER}",
            "notes": "See the CHANGELOG for the full set of changes.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "${URL}"
              }
            }
          }
          EOF

          echo "--- latest.json ---"
          cat latest.json
          gh release upload "${VERSION}" latest.json --clobber
